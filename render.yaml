services:
  # Backend — FastAPI
  - type: web
    name: telegramcode-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: HOST
        value: "0.0.0.0"
      - key: API_ID
        value: "0"
      - key: API_HASH
        value: ""

  # Frontend — React (Vite static)
  - type: web
    name: telegramcode-web
    runtime: static
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: telegramcode-api
          type: web
          property: host
