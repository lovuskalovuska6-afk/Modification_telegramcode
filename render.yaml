services:
  - type: web
    name: telegramcode-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: HOST
        value: "0.0.0.0"
      # Реальный вход: поставь свои значения с https://my.telegram.org/apps
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      # false = реальный Telegram, true = заглушка
      - key: MOCK
        value: "false"

  - type: web
    name: telegramcode-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://telegramcode-api-76rb.onrender.com"
